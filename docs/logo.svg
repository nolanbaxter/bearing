<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bearing">
  <title>Bearing</title>
  <!--
    A bear's paw drawn as a bearing: its pad and its five toes, as many as a
    bear has, are the balls. Each is lit from the upper left, a darker rim
    below it and a curved streak of shine along it, as on a polished ball.

    Mid-tone bronze on purpose, a bear's brown and a bearing's brass. It sits
    on white and on dark without a second file or a prefers-color-scheme
    switch, as Winding's blues do.
  -->
