name: Feature request
description: Something Bearing doesn't do yet, or a limitation you'd like gone.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to make
      description: The game, simulation or tool, and where Bearing falls short for it. What you need matters more than how it's built. ROADMAP.md says what is already planned.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The call, option or behaviour you have in mind, if you have one. How it might look in code.
      render: js
  - type: textarea
    id: around
    attributes:
      label: What you do now
      description: Any workaround, and other physics engines that do this well.
