<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bearing demo</title>
<!-- No icon, said outright, so the browser doesn't ask the server for one it hasn't got. -->
<link rel="icon" href="data:,">

<!--
  Bearing's scenes, drawn by Winding.

  Bearing draws nothing: it hands back every body's position and rotation as
  numbers, and an engine draws them. This page uses Winding, loaded from
  jsDelivr at a pinned version, and Bearing from this repository, so it always
  shows the code next to it. The demo is not part of the package, nothing in
  src/ imports it, and no test needs it: tests decide, this shows.

  RUN IT WITH A SERVER, since modules don't load over file://:

      node serve.js
      open http://localhost:8080/demo/

  It needs a browser with WebGPU (Chrome or Edge 113+, Safari 26+, Firefox on
  Windows), because Winding draws with it.
-->

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f1115; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px;
    font: 13px/1.4 system-ui, sans-serif;
  }
  button {
    font: inherit; color: #e6e8ec; background: #1d2027cc; border: 1px solid #343a46;
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  button[aria-pressed="true"] { background: #2f6f4e; border-color: #3f8f66; }
  #status {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px 12px;
    font: 12px/1.5 ui-monospace, Consolas, monospace; color: #8b93a1; background: #14161acc;
  }
  #status.bad { color: #ff9a9a; }
</style>

<canvas id="view"></canvas>
<nav id="scenes"></nav>
<p id="status">loading…</p>

<script type="module">
  import { Winding, Camera, OrbitController } from 'https://cdn.jsdelivr.net/npm/winding-engine@1.7.0/src/winding.js';
  import { World, readGlb } from '../src/bearing.js';
  import { box, sphere, capsule, triangles, heightfield, ramp } from './models.js';

  const status = document.getElementById('status');
  const canvas = document.getElementById('view');

  // Colours, linear, as Winding's 3D view takes them.
  const STONE = [0.2, 0.21, 0.23], WOOD = [0.55, 0.32, 0.14], CLAY = [0.62, 0.2, 0.12];
  const SKY = [0.12, 0.32, 0.62], LEAF = [0.18, 0.45, 0.2], SUN = [0.85, 0.6, 0.1];

  // Each scene builds a world and says where to look. `tick` runs every step.
  const SCENES = {
    pyramid: {
      label: 'Pyramid: 210 boxes',
      look: { target: [0, 9, 0], distance: 50, pitch: 0.25 },
      build(world) {
        for (let row = 0; row < 20; row++) {
          for (let k = 0; k < 20 - row; k++) {
            world.addBody({ position: [k - (19 - row) / 2, 0.5 + row, 0], color: row % 2 ? WOOD : CLAY });
          }
        }
      },
    },
    stack: {
      label: 'Stack of 10',
      look: { target: [0, 4, 0], distance: 16, pitch: 0.2 },
      build(world) {
        for (let k = 0; k < 10; k++) world.addBody({ position: [0, 0.5 + k, 0], color: k % 2 ? WOOD : SKY });
      },
    },
    bounce: {
      label: 'Bouncing balls',
      look: { target: [0, 2, 0], distance: 14, pitch: 0.15 },
      build(world) {
        [0, 0.3, 0.6, 0.8, 0.95].forEach((restitution, k) => {
          world.addBody({ shape: 'sphere', radius: 0.4, position: [(k - 2) * 1.5, 5, 0], restitution, color: [SKY, LEAF, SUN, CLAY, WOOD][k] });
        });
      },
    },
    slope: {
      label: 'Friction on slopes',
      look: { target: [0, 3, 0], distance: 22, pitch: 0.3 },
      build(world) {
        // Friction 0.5 holds a box up to about 26.6°: the left slope is 20°, the right 35°.
        for (const [degrees, x] of [[20, -6], [35, 6]]) {
          const t = (degrees * Math.PI) / 180, tilt = [0, 0, Math.sin(t / 2), Math.cos(t / 2)];
          world.addBody({ type: 'static', size: [12, 0.5, 4], position: [x, 3, 0], rotation: tilt, color: STONE });
          const up = [-Math.sin(t), Math.cos(t)];
          world.addBody({ position: [x + up[0] * 0.75 + Math.cos(t) * 3, 3 + up[1] * 0.75 + Math.sin(t) * 3, 0], rotation: tilt, color: degrees < 26.6 ? LEAF : CLAY });
        }
      },
    },
    platform: {
      label: 'Moving platform',
      look: { target: [0, 2, 0], distance: 16, pitch: 0.35 },
      build(world, scene) {
        const platform = world.addBody({ type: 'kinematic', size: [4, 0.4, 4], position: [-4, 1.5, 0], velocity: [2, 0, 0], color: STONE });
        for (let k = 0; k < 3; k++) world.addBody({ size: [0.8, 0.8, 0.8], position: [-4 + (k - 1) * 1.1, 2.1, 0], color: [WOOD, SKY, SUN][k] });
        world.addBody({ shape: 'capsule', radius: 0.3, height: 1.4, position: [-4, 3.1, 1], color: LEAF });
        scene.tick = () => {
          const x = platform.position[0];
          if (x > 4 && platform.velocity[0] > 0) platform.setVelocity(-2, 0, 0);
          if (x < -4 && platform.velocity[0] < 0) platform.setVelocity(2, 0, 0);
        };
      },
    },
    pile: {
      label: 'Mixed pile',
      look: { target: [0, 2, 0], distance: 18, pitch: 0.35 },
      build(world) {
        // Dropped from a loose cloud, each one offset and turned a little
        // differently (the same way every time), so they tumble into a heap.
        let n = 0;
        for (let layer = 0; layer < 6; layer++) {
          for (let x = -2; x <= 2; x++) {
            for (let z = -1; z <= 1; z++) {
              const kind = n++ % 3, jx = Math.sin(n * 12.9898) * 0.35, jz = Math.cos(n * 78.233) * 0.35;
              const at = [x * 1.25 + jx, 1.5 + layer * 1.4, z * 1.25 + jz];
              const axis = [Math.sin(n), Math.cos(n * 1.7), Math.sin(n * 2.3)], l = Math.hypot(...axis), turn = n * 0.9;
              const rotation = [...axis.map((v) => (v / l) * Math.sin(turn / 2)), Math.cos(turn / 2)];
              if (kind === 0) world.addBody({ size: [0.9, 0.6, 0.7], position: at, rotation, color: WOOD });
              else if (kind === 1) world.addBody({ shape: 'sphere', radius: 0.4, position: at, color: SKY });
              else world.addBody({ shape: 'capsule', radius: 0.25, height: 1, position: at, rotation, color: LEAF });
            }
          }
        }
      },
    },
    rain: {
      label: 'Rain: 2,000 balls',
      look: { target: [0, 2, 0], distance: 60, pitch: 0.45 },
      build(world) {
        // Spread over the whole floor and dropped from different heights:
        // thousands of bodies, but each only ever near a few, which is what
        // the broadphase is for. A wall around the floor keeps the ones
        // knocked rolling from rolling off it, so all of them come to rest
        // and go to sleep.
        for (const [x, z, sx, sz] of [[0, 30.5, 62, 1], [0, -30.5, 62, 1], [30.5, 0, 1, 60], [-30.5, 0, 1, 60]]) {
          world.addBody({ type: 'static', size: [sx, 3, sz], position: [x, 1.5, z], color: STONE });
        }
        for (let n = 0; n < 2000; n++) {
          const x = Math.sin(n * 12.9898) * 27, z = Math.cos(n * 78.233) * 27, y = 2 + (n % 40) * 0.6;
          world.addBody({ shape: 'sphere', radius: 0.3, restitution: 0.4, position: [x, y, z], color: [SKY, LEAF, SUN][n % 3] });
        }
      },
    },
    terrain: {
      label: 'Terrain: hills and a .glb ramp',
      look: { target: [2, 1, 0], distance: 40, pitch: 0.5 },
      build(world) {
        // Hills, as a heightfield: 49 by 49 heights half a metre apart, 4,608
        // triangles, kept as one number a sample.
        const columns = 49, heights = [];
        for (let j = 0; j < columns; j++) {
          for (let i = 0; i < columns; i++) {
            const x = (i - 24) * 0.5, z = (j - 24) * 0.5;
            heights.push(1.2 + 0.8 * Math.sin(x * 0.6) * Math.cos(z * 0.45) - 0.04 * x);
          }
        }
        world.addBody({ shape: 'heightfield', heights, columns, spacing: 0.5, color: LEAF });
        // A wall round the floor, so whatever rolls off the hills stays on it.
        for (const [x, z, sx, sz] of [[0, 30.5, 62, 1], [0, -30.5, 62, 1], [30.5, 0, 1, 60], [-30.5, 0, 1, 60]]) {
          world.addBody({ type: 'static', size: [sx, 1.5, sz], position: [x, 0.75, z], color: STONE });
        }
        // A ramp, as a level's .glb file holds it: Bearing reads its triangles
        // with readGlb, and Winding draws it from the very same bytes.
        const file = ramp(STONE);
        world.addBody({ shape: 'mesh', ...readGlb(file), position: [13, 0, 0], color: STONE, glb: file });
        let n = 0;
        for (let layer = 0; layer < 3; layer++) {
          for (let k = 0; k < 30; k++) {
            n++;
            const at = [Math.sin(n * 12.9898) * 10, 4 + layer * 1.5, Math.cos(n * 78.233) * 10];
            if (n % 3 === 0) world.addBody({ size: [0.6, 0.6, 0.6], position: at, color: WOOD });
            else if (n % 3 === 1) world.addBody({ shape: 'sphere', radius: 0.35, position: at, color: SKY });
            else world.addBody({ shape: 'capsule', radius: 0.2, height: 0.9, position: at, rotation: [0, 0, Math.SQRT1_2, Math.SQRT1_2], color: SUN });
          }
        }
        // Down the ramp, from the top, and stopped by a wall before the floor's edge.
        world.addBody({ type: 'static', size: [1, 1.5, 10], position: [25, 0.75, 0], color: STONE });
        for (let k = 0; k < 4; k++) world.addBody({ shape: 'sphere', radius: 0.35, position: [13.5, 3 + k, (k - 1.5) * 0.7], color: CLAY });
      },
    },
    walk: {
      label: 'Character: a scripted walk',
      look: { target: [0, 1.5, 0], distance: 24, pitch: 0.5 },
      build(world, scene) {
        // Stairs of 18 cm risers up to a deck 1.08 m high, a 25° ramp down off
        // its far end, a platform sliding back and forth across the way home,
        // and crates whose corners its route brushes. It is told only which way to
        // walk, toward each corner of the route in turn; Bearing does the rest.
        for (let k = 0; k < 6; k++) world.addBody({ type: 'static', size: [0.5, 0.18 * (k + 1), 3], position: [-4 + k * 0.5, 0.09 * (k + 1), -4], color: STONE });
        world.addBody({ type: 'static', size: [4, 1.08, 3], position: [0.75, 0.54, -4], color: STONE });
        const run = 1.08 / Math.tan((25 * Math.PI) / 180);
        world.addBody({ shape: 'mesh', vertices: [2.75, 1.08, -5.5, 2.75 + run, 0, -5.5, 2.75 + run, 0, -2.5, 2.75, 1.08, -2.5], indices: [0, 1, 2, 0, 2, 3], color: WOOD });
        const platform = world.addBody({ type: 'kinematic', size: [3, 0.25, 3], position: [-2, 0.125, 4], velocity: [1.5, 0, 0], color: SKY });
        for (const [x, z] of [[6.95, 1], [-5, 4.55], [-6.2, -1]]) world.addBody({ size: [0.8, 0.8, 0.8], position: [x, 0.4, z], color: CLAY });
        const hero = world.addBody({ type: 'character', shape: 'capsule', radius: 0.3, height: 1.8, position: [-7, 0.9, -4], color: SUN });
        const route = [[-4.5, -4], [-1, -4], [2.2, -4], [6.5, -4], [6.5, 4], [-6.5, 4], [-7, -4]];
        let next = 0;
        scene.tick = () => {
          const x = platform.position[0];
          if (x > 2 && platform.velocity[0] > 0) platform.setVelocity(-1.5, 0, 0);
          if (x < -2 && platform.velocity[0] < 0) platform.setVelocity(1.5, 0, 0);
          const p = hero.position, [tx, tz] = route[next];
          const dx = tx - p[0], dz = tz - p[2], d = Math.hypot(dx, dz);
          if (d < 0.4) next = (next + 1) % route.length;
          hero.setVelocity((dx / d) * 2.5, hero.velocity[1], (dz / d) * 2.5);
        };
      },
    },
    layers: {
      label: 'Layers: two colours',
      look: { target: [0, 3, 0], distance: 20, pitch: 0.3 },
      build(world) {
        // Red and blue are on layers 2 and 3, and each one's mask leaves out
        // the other's layer: they fall through each other, but land on the
        // floor (layer 1) and stack on their own colour.
        const RED = 1 << 1, BLUE = 1 << 2;
        for (let k = 0; k < 8; k++) {
          world.addBody({ position: [-0.25, 1 + k * 1.6, 0], layers: RED, mask: ~BLUE, color: CLAY });
          world.addBody({ position: [0.25, 1.8 + k * 1.6, 0], layers: BLUE, mask: ~RED, color: SKY });
        }
      },
    },
  };

  try {
    const engine = await Winding.create(canvas);
    const camera = new Camera({ fovY: Math.PI / 4, near: 0.1 });
    const orbit = new OrbitController(camera, canvas, { distance: 30 });

    // Models, made once per shape and colour (and per size, for capsules).
    const models = new Map();
    async function model(desc) {
      // Level geometry is one of a kind: drawn from its own file, or from its triangles.
      if (desc.glb) return engine.load(desc.glb);
      if (desc.shape === 'mesh') return engine.load(triangles(desc.vertices, desc.indices, desc.color));
      if (desc.shape === 'heightfield') return engine.load(heightfield(desc.heights, desc.columns, desc.spacing, desc.color));
      const key = JSON.stringify([desc.shape, desc.shape === 'capsule' ? [desc.radius, desc.height] : 0, desc.color]);
      if (!models.has(key)) {
        const bytes = desc.shape === 'sphere' ? sphere(desc.color)
          : desc.shape === 'capsule' ? capsule(desc.radius, desc.height, desc.color) : box(desc.color);
        models.set(key, engine.load(bytes));
      }
      return models.get(key);
    }

    let current = null;
    async function show(name) {
      const def = SCENES[name];
      const world = new World();
      const scene = engine.createScene();
      scene.addLight({ type: 'directional', direction: [-0.4, -0.9, -0.3], intensity: 3, castShadow: true });
      const pending = [];
      // Bodies are added through this, which notes how to draw each; the
      // colour, and a model file to draw from, are the demo's, not Bearing's,
      // so they are taken off first.
      const add = world.addBody.bind(world);
      world.addBody = (options) => {
        const { color = STONE, glb, ...body } = options;
        const handle = add(body);
        const desc = world.bodyOf(handle);
        pending.push({ handle, desc: { ...desc, color, glb } });
        return handle;
      };
      world.addBody({ type: 'static', size: [60, 1, 60], position: [0, -0.5, 0], color: STONE });
      const state = { tick: null };
      def.build(world, state);
      delete world.addBody;   // back to Bearing's own

      const drawn = [], nodes = [];
      for (const { handle, desc } of pending) {
        const node = scene.add(await model(desc));
        if (desc.shape === 'box') node.setScale(desc.size[0], desc.size[1], desc.size[2]);
        else if (desc.shape === 'sphere') node.setScale(desc.radius);
        drawn.push({ handle, node });
        nodes[handle.slot] = node;
      }
      // seen: the stepCount the nodes were last drawn at, for world.moved().
      current = { world, scene, drawn, nodes, state, name, seen: 0 };
      globalThis.demo = current;   // for poking at from the console
      // Where the camera eases to; Winding's OrbitController moves by `desired`.
      Object.assign(orbit.desired, { target: def.look.target, distance: def.look.distance, pitch: def.look.pitch });
      for (const b of nav.children) b.setAttribute('aria-pressed', String(b.dataset.scene === name));
      engine.run(scene, camera, { update, frame });
    }

    let stepMs = 0;
    function update(dt) {
      const { world, state } = current;
      state.tick?.();
      const t0 = performance.now();
      world.step(dt);
      // A running average of what a step costs, shown below.
      stepMs += (performance.now() - t0 - stepMs) * 0.05;
    }

    // Each body that moved drawn between its last two steps, by how far this
    // frame falls between them: positions blended straight, rotations the
    // short way. world.moved() lists only those, so a sleeping pile costs
    // nothing to draw.
    const q = [0, 0, 0, 0];
    function frame(alpha, clock) {
      orbit.update(clock.realDelta);
      const { world, drawn, nodes } = current;
      const t = world.transforms, p = world.previous;
      for (const slot of world.moved(current.seen)) {
        const node = nodes[slot], o = slot * 7;
        node.setPosition(
          p[o] + (t[o] - p[o]) * alpha,
          p[o + 1] + (t[o + 1] - p[o + 1]) * alpha,
          p[o + 2] + (t[o + 2] - p[o + 2]) * alpha);
        const dot = p[o + 3] * t[o + 3] + p[o + 4] * t[o + 4] + p[o + 5] * t[o + 5] + p[o + 6] * t[o + 6];
        const s = dot < 0 ? -1 : 1;
        for (let k = 0; k < 4; k++) q[k] = p[o + 3 + k] * s + (t[o + 3 + k] - p[o + 3 + k] * s) * alpha;
        const l = Math.hypot(q[0], q[1], q[2], q[3]);
        node.setRotation([q[0] / l, q[1] / l, q[2] / l, q[3] / l]);
      }
      current.seen = world.stepCount;
      let asleep = 0;
      for (const { handle } of drawn) if (handle.asleep) asleep++;
      status.textContent = `${SCENES[current.name].label} · ${world.bodyCount} bodies, ${asleep} asleep · `
        + `${stepMs.toFixed(2)} ms a step · drag to orbit, wheel to zoom`;
    }

    const nav = document.getElementById('scenes');
    for (const [name, def] of Object.entries(SCENES)) {
      const b = document.createElement('button');
      b.textContent = def.label;
      b.dataset.scene = name;
      b.onclick = () => { engine.stop(); show(name); };
      nav.append(b);
    }
    const restart = document.createElement('button');
    restart.textContent = 'Restart';
    restart.onclick = () => { engine.stop(); show(current.name); };
    nav.append(restart);

    await show('pyramid');
  } catch (e) {
    status.className = 'bad';
    status.textContent = `${e.message}`;
    console.error(e);
  }
</script>
